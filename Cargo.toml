[package]
name = "ai-limit-ping"
version = "0.1.1"
edition = "2021"
authors = ["Kevin Johansson <kevin_1351@hotmail.com>"]
description = "Near 0% CPU & RAM background daemon and CLI that keeps 5-hour rate limit windows alive for Codex, Antigravity, and Claude Code"
license = "MIT"
repository = "https://github.com/kvn1351/ai-limit-ping"

[lib]
name = "ai_limit_ping"
path = "src/lib.rs"


[[bin]]
name = "alp"
path = "src/bin/alp.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time", "process", "signal", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
colored = "2.1"
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
